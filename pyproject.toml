[project]
name = "hiring-radar"
version = "0.1.0"
description = "What skills is the AI job market asking for, by city — extracted from job descriptions and evaluated."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
