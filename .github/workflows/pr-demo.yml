name: PR screenshots

# Before/after screenshots on PRs that change the frontend (HIR-231, replacing the
# HIR-214 demo, which filmed fake data and looked the same on every PR).
#
# How: build the dashboard from main ("before") and from the branch ("after"), open both
# against the LIVE site's data, seconds apart in one browser, and keep only the views
# whose screenshots differ (web/e2e/before-after.spec.js). The images go to the
# `pr-evidence` branch, because a PR comment can only show an image that has a URL, and
# one comment on the PR is written or updated.
#
# Does NOT: run for backend-only or docs-only PRs, record video, use a demo database,
# write to the live site (only GET /api requests pass through), deploy, or block a merge.
#
# Needs the repository secret SITE_LOGIN = "user:password" for the site's login. Without
# it the job says so in its log and posts nothing.

on:
  pull_request:
    paths:
      - "web/src/**"
      - "web/index.html"
      - "web/public/**"
      - "web/e2e/**"
      - "web/playwright.config.js"
      - ".github/workflows/pr-demo.yml"

permissions:
  contents: read

concurrency:
  group: pr-shots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SHOT_LIVE: https://34-159-223-190.sslip.io

jobs:
  shots:
    name: Before/after screenshots
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push images to the pr-evidence branch
      pull-requests: write   # write the comment
    steps:
      - name: Check the site login is set
        id: login
        env:
          SITE_LOGIN: ${{ secrets.SITE_LOGIN }}
        run: |
          if [ -z "$SITE_LOGIN" ]; then
            echo "::warning::SITE_LOGIN secret is not set; no screenshots (the live site needs its login)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.login.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - uses: actions/checkout@v4
        if: steps.login.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        if: steps.login.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Build both versions of the dashboard
        if: steps.login.outputs.ok == 'true'
        run: |
          for side in base head; do (cd "$side/web" && npm ci && npm run build); done

      - name: Take the screenshots
        if: steps.login.outputs.ok == 'true'
        working-directory: head/web
        env:
          SHOT_AUTH: ${{ secrets.SITE_LOGIN }}
          SHOT_BEFORE: ${{ github.workspace }}/base/web/dist
          SHOT_AFTER: ${{ github.workspace }}/head/web/dist
          SHOT_OUT: ${{ github.workspace }}/out
        run: |
          npx playwright install --with-deps chromium
          npm run shots
          rm -rf "$SHOT_OUT/_playwright"

      - name: Copy to the pr-evidence branch
        if: steps.login.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if ! git clone -q --depth 1 --branch pr-evidence "$url" store 2>/dev/null; then
            git init -q store && git -C store checkout -q --orphan pr-evidence
            git -C store remote add origin "$url"
          fi
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Only the latest run per PR is kept; the comment always points at it.
          rm -rf "pr-$PR" && mkdir -p "pr-$PR/${SHA:0:7}"
          cp -r ../out/. "pr-$PR/${SHA:0:7}/"
          git add -A && git commit -qm "PR #$PR screenshots at ${SHA:0:7}" || exit 0
          # Two PRs can publish at once; rebase onto the other's push and retry.
          for i in 1 2 3 4 5; do
            git push -q origin pr-evidence && exit 0
            git pull -q --rebase --depth 1 origin pr-evidence || true
            sleep $((i * 2))
          done
          exit 1

      - name: Write or update the PR comment
        if: steps.login.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="https://raw.githubusercontent.com/$REPO/pr-evidence/pr-$PR/${SHA:0:7}"
          changed() { [ -f "out/$1/changed.json" ] && jq -r '.[]' "out/$1/changed.json"; }
          n=$( { changed desktop; changed phone; } | wc -l )
          {
            echo "<!-- pr-demo -->"
            echo "### Before / after"
            if [ "$n" -eq 0 ]; then
              echo "No visible change on the home, city, compare or job pages (live data, \`${SHA:0:7}\`)."
            else
              echo "Live data. Only the views that changed are shown. **Before** = main, **after** = this branch at \`${SHA:0:7}\`."
              for p in desktop phone; do
                views=$(changed $p); [ -n "$views" ] || continue
                w=$([ "$p" = desktop ] && echo 420 || echo 200)
                echo; echo "**${p^}**"; echo
                echo "| | Before | After |"
                echo "|---|---|---|"
                for v in $views; do
                  echo "| $v | <img src=\"$base/$p/$v-before.png\" width=\"$w\"> | <img src=\"$base/$p/$v-after.png\" width=\"$w\"> |"
                done
              done
            fi
          } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- pr-demo -->"))][0].id // empty' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
