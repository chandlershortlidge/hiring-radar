name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Inert today, deliberately kept (HIR-136). There is no merge queue on this
  # repository and there cannot be: GitHub offers queues only on organization-owned
  # repositories, and this one belongs to a personal account. Merges go through
  # GitHub auto-merge instead, which runs on `pull_request` checks. This trigger
  # costs nothing while no queue exists and means a future move to an org-owned
  # repository needs no CI change — `test` and `build-web` would already run on
  # the queue's combined commits, while `deploy` stays gated on `push` to main.
  merge_group:
  # Started by .github/workflows/merge-reviewed.yml after it merges a PR (HIR-262). A merge
  # made with a workflow's token fires no `push`, so without this the deploy would not run.
  workflow_dispatch:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -q

  build-web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # The CI half of AGENTS.md "The eval gate" (HIR-134). A PR that changes the extractor or
  # the skill list must add a dev eval result, unless the committed baseline already
  # measured this exact extractor. No key and no model call: it reads the PR's file list
  # and, only when that would decide it, runs eval_table.py's own version check. The
  # reviewer agent checks the same rule, but a PR opened by hand never meets the reviewer.
  #
  # Like "Rules gate", a red result only stops a merge once "Eval gate" is on the
  # repository's required-checks list, and that list is Chandler's to change.
  eval-gate:
    name: Eval gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # The API's file list, as in rules-gate.yml: no fetch depth, no base-ref guessing.
      # A rename is listed under both names, so moving a gated file away still counts.
      - name: Collect the PR's changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq \
            '.[] | "\(.status)\t\(.filename)", (select(.previous_filename) | "renamed-from\t\(.previous_filename)")' \
            > changes.txt
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Did this PR bring a dev eval result?
        run: uv run python scripts/eval_gate.py --changes-file changes.txt

  # Deploy, then the robot visitor on the live site; a failure rolls back and files a
  # ticket (HIR-258). The deploy steps themselves are in deploy.yml, unchanged.
  #
  # The `release` lock spans the whole deploy-and-watch, so a second merge waits until the
  # first is watched: otherwise a rollback for one could overwrite the next deploy. (The
  # deploy job inside holds its own `deploy` lock; the two names must differ, or the inner
  # job would wait for the outer one forever.)
  release:
    name: Deploy and watch
    needs: [test, build-web]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write # the robot's result moves the site-good tag and publishes screenshots
      id-token: write # the deploy's login to Google Cloud
    concurrency:
      group: release
      cancel-in-progress: false
    uses: ./.github/workflows/site-watch.yml
    with:
      mode: deploy
      sha: ${{ github.sha }}
    secrets: inherit