name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Inert today, deliberately kept (HIR-136). There is no merge queue on this
  # repository and there cannot be: GitHub offers queues only on organization-owned
  # repositories, and this one belongs to a personal account. Merges go through
  # GitHub auto-merge instead, which runs on `pull_request` checks. This trigger
  # costs nothing while no queue exists and means a future move to an org-owned
  # repository needs no CI change — `test` and `build-web` would already run on
  # the queue's combined commits, while `deploy` stays gated on `push` to main.
  merge_group:
  # Started by .github/workflows/merge-reviewed.yml after it merges a PR (HIR-262). A merge
  # made with a workflow's token fires no `push`, so without this the deploy would not run.
  workflow_dispatch:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -q

  build-web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to VM
    needs: [test, build-web]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build && tar -czf ../web-dist.tgz dist
      - uses: google-github-actions/auth@v2
        with:
          project_id: hiring-radar-512318
          workload_identity_provider: projects/128016795965/locations/global/workloadIdentityPools/github/providers/hiring-radar-repo
          service_account: github-deployer@hiring-radar-512318.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # One IAP/OS Login connection, not two: the tarball arrives on this ssh
      # invocation's stdin instead of a separate `gcloud compute scp` (HIR-106).
      # A truncated pipe fails `tar -xzf` in remote-deploy.sh, so the job goes red.
      - name: Deploy on VM
        run: |
          gcloud compute ssh hiring-radar --zone=europe-west3-a --tunnel-through-iap --quiet \
            --strict-host-key-checking=no --ssh-key-expire-after=30m --command "
            set -e
            cat > /tmp/web-dist.tgz
            sudo -u hiring-radar -H git -C /opt/hiring-radar/app fetch origin main
            sudo -u hiring-radar -H git -C /opt/hiring-radar/app reset --hard ${{ github.sha }}
            sudo bash /opt/hiring-radar/app/deploy/remote-deploy.sh /tmp/web-dist.tgz
          " < web-dist.tgz